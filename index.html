<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гроссбух"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b6e6e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Мой гроссбух</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: боковое меню + рабочая область на широком экране, прокручиваемые вкладки сверху на узком. Цифры моноширинные, как в бухгалтерской книге. */
:root{
  --bg:#edf0f1; --surface:#ffffff; --surface2:#f4f7f7; --ink:#111c1f; --muted:#5a6a6f; --line:#d8e0e2;
  --accent:#0b6e6e; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --pos:#12794a; --neg:#bf3a2d; --warn:#a96a0c; --warn-soft:#fbefd6; --neg-soft:#fbe3df; --pos-soft:#dff3e8;
  --c1:#2f6fdb; --c2:#e0773a; --c3:#1f9d7a; --c4:#8a5cd0; --c5:#c99a14; --c6:#cf4d79; --c7:#5b7c8a; --c8:#7a9528;
  --in:#1f9d7a; --out:#e0773a;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1214; --surface:#131c1f; --surface2:#19252a; --ink:#e8eff0; --muted:#93a5ab; --line:#26363c;
  --accent:#3fb8b0; --accent-ink:#04201f; --accent-soft:#12302f;
  --pos:#4cc38a; --neg:#ff8272; --warn:#e5b04b; --warn-soft:#33270f; --neg-soft:#3a1c18; --pos-soft:#12301f;
  --c1:#6d9cf0; --c2:#f09a68; --c3:#4cc3a0; --c4:#b394ea; --c5:#e3be4a; --c6:#e5809f; --c7:#8fadb9; --c8:#a3bd55;
  --in:#4cc3a0; --out:#f09a68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1214; --surface:#131c1f; --surface2:#19252a; --ink:#e8eff0; --muted:#93a5ab; --line:#26363c;
  --accent:#3fb8b0; --accent-ink:#04201f; --accent-soft:#12302f;
  --pos:#4cc38a; --neg:#ff8272; --warn:#e5b04b; --warn-soft:#33270f; --neg-soft:#3a1c18; --pos-soft:#12301f;
  --c1:#6d9cf0; --c2:#f09a68; --c3:#4cc3a0; --c4:#b394ea; --c5:#e3be4a; --c6:#e5809f; --c7:#8fadb9; --c8:#a3bd55;
  --in:#4cc3a0; --out:#f09a68; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .warn{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:208px minmax(0,1fr);gap:28px;padding-block:20px 56px}
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-family:var(--f-num);font-size:13px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:7px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-family:var(--f-num)}
.side .lockbtn{margin-top:4px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:0 48px}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:10px;gap:8px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
  .side .brandrow{display:flex;justify-content:space-between;align-items:center}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;padding-bottom:8px;scrollbar-width:none}
  .nav button{white-space:nowrap;padding:7px 11px}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent);border-radius:7px 7px 0 0}
}
.side .brandrow{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* page head */
.ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.ph h1{font-size:22px;letter-spacing:-.015em}
.ph .sub{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* controls */
.btn{all:unset;cursor:pointer;box-sizing:border-box;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.ic:hover{background:var(--surface2);color:var(--ink)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.tools select,.tools input{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none;width:0}
.seg span{display:block;padding:7px 14px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.row2{grid-template-columns:minmax(0,1fr)}}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:22px;font-weight:600}
.kpi .s{font-size:12px;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.hero .big{font-size:34px;font-weight:600;line-height:1.1}
.hero .l{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.bad{background:var(--neg-soft);border-color:color-mix(in srgb,var(--neg) 35%,transparent)}
.alert.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.alerts{display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* lists + tables */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.li .amt{text-align:right;white-space:nowrap;font-weight:500}
.li .acts{display:flex;gap:4px}
.dayh{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:12px 0 4px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
tr.total td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
tr.sub td{color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.neg i{background:var(--neg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 4px 3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px}
.chip button{all:unset;cursor:pointer;color:var(--muted);padding:0 6px;border-radius:99px}
.chip button:hover{color:var(--ink)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 220px}
.legend .it{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.legend .it span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:190px;height:190px;flex:none}
.donutwrap text{font-family:var(--f-num);fill:var(--muted)}

/* modal + lock */
#modal{position:fixed;inset:0;background:rgba(5,12,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;margin-block:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet.wide{max-width:760px}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:16px}
.sheet form,.sheet .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet footer{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:70;font-size:13.5px;max-width:90vw}
#toast[hidden]{display:none}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.lockbox h1{font-size:20px}
.lockbox p{margin:0;color:var(--muted);font-size:13px;min-height:1.4em}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{all:unset;cursor:pointer;height:60px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-num);font-size:22px;font-weight:500}
.pad button:hover{border-color:var(--accent)}
.pad button:active{background:var(--accent-soft)}
.pad button:focus-visible{outline:2px solid var(--accent)}
.pad .fn{background:transparent;border-color:transparent;font-size:14px;color:var(--muted);font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.codebox{font-family:var(--f-num);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all}
details>summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;padding:4px 0}
.sep{height:1px;background:var(--line);margin:4px 0}
</style>
</head><body>
<div id="lock"></div>
<div class="shell" id="shell" hidden>
  <aside class="side"><div class="brandrow"><div class="brand"><i>₿</i>Мой гроссбух</div><button type="button" class="btn sm ghost lockbtn" data-act="lock" aria-label="Заблокировать">Заблокировать</button></div><nav class="nav" id="nav" aria-label="Разделы"></nav></aside>
  <main id="main"></main>
</div>
<div id="modal" hidden></div><div id="toast" role="status" hidden></div>
<script>
'use strict';
/* ---------- утилиты ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>iso(new Date());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function addMonths(s,n,day){const d=parseD(s);const t=new Date(d.getFullYear(),d.getMonth()+n,1);const dd=Math.min(day||d.getDate(),dim(t.getFullYear(),t.getMonth()));return iso(new Date(t.getFullYear(),t.getMonth(),dd))}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const monthEnd=s=>{const d=parseD(s);return iso(new Date(d.getFullYear(),d.getMonth()+1,0))};
const ymOf=s=>s.slice(0,7);
const MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MNF=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const ymLabel=ym=>{const [y,m]=ym.split('-').map(Number);return `${MN[m-1]} ${String(y).slice(2)}`};
const ymFull=ym=>{const [y,m]=ym.split('-').map(Number);return `${MNF[m-1]} ${y}`};
const dLabel=s=>{const d=parseD(s);return `${d.getDate()} ${MN[d.getMonth()]}`};
const dLabelY=s=>{const d=parseD(s);return `${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`};
function monthsBack(n){const d=new Date();const a=[];for(let i=n-1;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(`${t.getFullYear()}-${pad(t.getMonth()+1)}`)}return a}
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;

const DEC={BTC:6,ETH:5,USDT:2};
const SYM={TJS:'сом.',USD:'$',EUR:'€',RUB:'₽',USDT:'USDT',BTC:'BTC',ETH:'ETH',KZT:'₸',UZS:'сум',CNY:'¥',AED:'AED',TRY:'₺'};
const decOf=c=>DEC[c]??2;
function num(n,c){const d=decOf(c||'');const v=Math.abs(n)<5e-9?0:n;return v.toLocaleString('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:Number.isInteger(v)?0:Math.min(2,d)})}
function money(n,c){return `${num(n,c)} ${SYM[c]||c}`}
function short(n){const a=Math.abs(n);const s=n<0?'−':'';if(a>=1e6)return s+(a/1e6).toFixed(1).replace('.0','')+'M';if(a>=1e3)return s+(a/1e3).toFixed(1).replace('.0','')+'k';return s+Math.round(a)}
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- состояние ---------- */
let S=null,KEY=null,SALT=null,META={len:4,fails:0,until:0,lock:5};
const STORE='ledger.data.v1',METAK='ledger.meta.v1';
let storageOk=true;
const ui={tab:'home',period:'m:'+monthsBack(1)[0],bizSel:null,donutBy:'cat',txType:'',txBiz:'',txAcc:'',txQ:'',rbiz:''};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){storageOk=false;return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){storageOk=false;return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};

const CURRENCIES=['TJS','USD','EUR','RUB','USDT','BTC','ETH','KZT','UZS','CNY','AED','TRY'];
const ACC_TYPES={cash:'Наличные',debit:'Дебетовая карта',savings:'Накопительный счёт',crypto:'Криптовалюта',other:'Другое'};
const ITEM_KINDS={realty:'Недвижимость',vehicle:'Транспорт',invest:'Инвестиции',other:'Прочие активы',liab:'Обязательство (кредит, ипотека)'};

/* ---------- шифрование ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pin,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function packState(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(S)));
  return {app:'ledger',v:1,salt:b64(SALT),iv:b64(iv),ct:b64(ct)}}
async function unpack(pkg,pin){const salt=unb64(pkg.salt);const k=await deriveKey(pin,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},k,unb64(pkg.ct));return {state:JSON.parse(dec.decode(pt)),key:k,salt}}
let saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){clearTimeout(saveT);saveT=null;if(!S||!KEY)return;try{const p=await packState();if(!lsSet(STORE,JSON.stringify(p)))renderStorageWarn()}catch(e){storageOk=false;renderStorageWarn()}}
const saveMeta=()=>lsSet(METAK,JSON.stringify(META));
function commit(){persist();render()}

/* ---------- экран PIN ---------- */
let pin='',lockMode='unlock',setupFirst='',busy=false;
function lockHTML(msg){
  const title=lockMode==='unlock'?'Введите PIN':lockMode==='setup1'?'Придумайте PIN':'Повторите PIN';
  const sub=lockMode==='unlock'?'Данные зашифрованы в этом браузере':lockMode==='setup1'?'Он шифрует все данные. Если забыть PIN, восстановить можно только из бэкапа.':'Введите тот же PIN ещё раз';
  const dots=Array.from({length:META.len},(_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join('');
  const len=lockMode==='setup1'?`<div class="seg" role="radiogroup" aria-label="Длина PIN"><label><input type="radio" name="plen" value="4" ${META.len===4?'checked':''}><span>4 цифры</span></label><label><input type="radio" name="plen" value="6" ${META.len===6?'checked':''}><span>6 цифр</span></label></div>`:'';
  return `<div class="lockbox"><div class="brand"><i>₿</i>Мой гроссбух</div><h1>${title}</h1>${len}<div class="dots" id="dots">${dots}</div><p id="lockmsg" role="status">${esc(msg||sub)}</p>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}" aria-label="${n}">${n}</button>`).join('')}<button type="button" class="fn" data-k="clr">Сброс</button><button type="button" data-k="0" aria-label="0">0</button><button type="button" class="fn" data-k="del" aria-label="Стереть">⌫</button></div></div>`}
function showLock(mode,msg){S=null;KEY=null;pin='';lockMode=mode;$('#shell').hidden=true;closeModal();const l=$('#lock');l.hidden=false;l.innerHTML=lockHTML(msg)}
function paintDots(){const d=$('#dots');if(d)d.innerHTML=Array.from({length:META.len},(_,i)=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}
function lockMsg(m){const e=$('#lockmsg');if(e)e.textContent=m}
function shake(){const d=$('#dots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
async function pinKey(k){
  if(busy||$('#lock').hidden)return;
  if(META.until>Date.now()&&lockMode==='unlock'){lockMsg(`Подождите ${Math.ceil((META.until-Date.now())/1000)} с`);return}
  if(k==='del')pin=pin.slice(0,-1);else if(k==='clr')pin='';else if(pin.length<META.len)pin+=k;
  paintDots();
  if(pin.length<META.len)return;
  busy=true;
  try{
    if(lockMode==='setup1'){setupFirst=pin;pin='';lockMode='setup2';busy=false;$('#lock').innerHTML=lockHTML();return}
    if(lockMode==='setup2'){
      if(pin!==setupFirst){pin='';setupFirst='';lockMode='setup1';busy=false;$('#lock').innerHTML=lockHTML('PIN не совпал. Попробуйте ещё раз.');return}
      SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(pin,SALT);S=blankState();META.fails=0;META.until=0;saveMeta();await flush();enter();return}
    const raw=lsGet(STORE);const pkg=JSON.parse(raw);
    try{const r=await unpack(pkg,pin);S=r.state;KEY=r.key;SALT=r.salt;META.fails=0;META.until=0;saveMeta();enter()}
    catch(e){META.fails++;let m='Неверный PIN';if(META.fails>=5){META.until=Date.now()+Math.min(300,30*(META.fails-4))*1000;m=`Слишком много попыток. Подождите ${Math.ceil((META.until-Date.now())/1000)} с`}saveMeta();pin='';paintDots();shake();lockMsg(m)}
  }finally{busy=false}
}
document.addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k)pinKey(k.dataset.k)});
document.addEventListener('change',e=>{if(e.target.name==='plen'){META.len=+e.target.value;pin='';saveMeta();$('#lock').innerHTML=lockHTML()}});
document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('del');else if(e.key==='Escape')pinKey('clr')});

/* ---------- расчёты ---------- */
function effects(){
  const ef=[];
  for(const t of S.tx){
    if(t.type==='income')ef.push({d:t.date,a:t.accId,v:+t.amount});
    else if(t.type==='expense')ef.push({d:t.date,a:t.accId,v:-t.amount});
    else if(t.type==='transfer'){ef.push({d:t.date,a:t.accId,v:-t.amount});ef.push({d:t.date,a:t.toId,v:+t.toAmount})}
  }
  for(const d of S.debts){
    const a=d.accId&&accById(d.accId);
    if(a&&d.disb)ef.push({d:d.start,a:a.id,v:(d.dir==='owe'?1:-1)*conv(d.amount,d.cur,a.currency)});
    for(const p of d.payments||[]){const pa=p.accId&&accById(p.accId);if(pa)ef.push({d:p.date,a:pa.id,v:(d.dir==='owe'?-1:1)*conv(p.amount,d.cur,pa.currency)})}
  }
  return ef;
}
function balances(upto){
  const m={};S.accounts.forEach(a=>m[a.id]=+a.opening||0);
  for(const e of effects())if((!upto||e.d<=upto)&&e.a in m)m[e.a]+=e.v;
  return m;
}
const totalCash=bal=>S.accounts.reduce((s,a)=>s+toBase(bal[a.id]||0,a.currency),0);

function inPeriod(date,p=ui.period){if(p==='all')return true;const [k,v]=p.split(':');return k==='m'?date.startsWith(v):date.startsWith(v)}
function periodLabel(p=ui.period){if(p==='all')return 'всё время';const [k,v]=p.split(':');return k==='m'?ymFull(v):`${v} год`}
function periodOptions(){const ms=monthsBack(12).reverse();const y=new Date().getFullYear();
  return [...ms.map(m=>[`m:${m}`,ymFull(m)]),[`y:${y}`,`${y} год`],[`y:${y-1}`,`${y-1} год`],['all','Всё время']]}

function calc(list){
  const r={rev:0,oth:0,inc:0,exp:0,profit:0,byCat:{},byBiz:{}};
  const bz=id=>(r.byBiz[id]??={rev:0,oth:0,exp:0,inc:0});
  for(const t of list){
    if(t.type!=='income'&&t.type!=='expense')continue;
    const v=toBase(t.amount,accCur(t.accId));const c=catById(t.cat);const b=bz(t.biz);
    if(t.type==='income'){if(c?.rev){r.rev+=v;b.rev+=v}else{r.oth+=v;b.oth+=v}r.inc+=v;b.inc+=v}
    else{r.exp+=v;b.exp+=v;const k=t.cat||'_';r.byCat[k]=(r.byCat[k]||0)+v}
  }
  r.profit=r.inc-r.exp;
  for(const b of Object.values(r.byBiz))b.profit=b.inc-b.exp;
  return r;
}
const txIn=(p=ui.period,biz)=>S.tx.filter(t=>inPeriod(t.date,p)&&(!biz||t.biz===biz));

function sched(d){
  const n=Math.max(1,d.n||1),every=d.every||1,base=Math.floor(d.amount/n*100)/100;
  const arr=[];let sum=0;const day=parseD(d.first).getDate();
  for(let i=0;i<n;i++){const amt=i===n-1?r2(d.amount-sum):base;sum+=amt;arr.push({date:addMonths(d.first,i*every,day),amt})}
  const paid=(d.payments||[]).reduce((s,p)=>s+p.amount,0);let cum=0;
  for(const x of arr){x.paid=Math.max(0,Math.min(x.amt,paid-cum));cum+=x.amt;x.done=x.paid>=x.amt-0.005}
  return {arr,paid,left:Math.max(0,r2(d.amount-paid)),next:arr.find(x=>!x.done)}
}
function debtAlerts(){
  const t=todayStr();const out=[];
  for(const d of S.debts){const s=sched(d);if(!s.next)continue;const days=diffDays(s.next.date,t);
    if(days<=(d.remind??3))out.push({d,s,days,amt:s.next.amt-s.next.paid})}
  return out.sort((a,b)=>a.days-b.days);
}
function advance(r,s){return r.freq==='weekly'?addDays(s,7):r.freq==='yearly'?addMonths(s,12,r.day):addMonths(s,1,r.day)}
function recToTx(r,date){return {id:uid(),type:r.type,date,accId:r.accId,amount:r.amount,biz:r.biz,cat:r.cat,note:r.name,rid:r.id}}
function runRecurring(){
  let n=0;const t=todayStr();
  for(const r of S.recurring){
    if(!r.active||!r.auto)continue;let g=0;
    while(r.next<=t&&(!r.end||r.next<=r.end)&&g++<60&&accById(r.accId)){S.tx.push(recToTx(r,r.next));r.next=advance(r,r.next);n++}
  }
  return n;
}
const pendingRec=()=>{const t=todayStr();return S.recurring.filter(r=>r.active&&!r.auto&&r.next<=t&&(!r.end||r.next<=r.end))};
function occurrences(r,until){const out=[];let d=r.next,g=0;while(d<=until&&(!r.end||d<=r.end)&&g++<60){out.push(d);d=advance(r,d)}return out}

function forecast(){
  const t=todayStr(),end=monthEnd(t),bal=balances();
  const ev=[];
  for(const r of S.recurring){if(!r.active||!accById(r.accId))continue;
    for(const d of occurrences(r,end))ev.push({date:d<t?t:d,orig:d,acc:r.accId,v:(r.type==='income'?1:-1)*r.amount,label:r.name,kind:'rec'})}
  for(const d of S.debts){const s=sched(d);
    for(const x of s.arr){if(x.done||x.date>end)continue;const rest=x.amt-x.paid;const a=d.accId&&accById(d.accId);
      const sign=d.dir==='owe'?-1:1;
      ev.push({date:x.date<t?t:x.date,orig:x.date,acc:a?a.id:null,v:sign*(a?conv(rest,d.cur,a.currency):conv(rest,d.cur,accCur(null))),vb:sign*toBase(rest,d.cur),label:(d.dir==='owe'?'Долг: ':'Вернут: ')+d.who,kind:'debt'})}}
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const per=S.accounts.map(a=>{const e=ev.filter(x=>x.acc===a.id);const sum=e.reduce((s,x)=>s+x.v,0);return {a,now:bal[a.id]||0,delta:sum,end:(bal[a.id]||0)+sum}});
  const evBase=x=>x.vb!==undefined?x.vb:toBase(x.v,accCur(x.acc));
  const nowT=totalCash(bal);const endT=nowT+ev.reduce((s,x)=>s+evBase(x),0);
  let run=nowT;const pts=[{date:t,v:run}];for(const x of ev){run+=evBase(x);pts.push({date:x.date,v:run})}pts.push({date:end,v:run});
  return {end,ev,per,nowT,endT,pts,evBase};
}

function netWorth(bal=balances()){
  const cashPos=S.accounts.reduce((s,a)=>s+Math.max(0,toBase(bal[a.id]||0,a.currency)),0);
  const cashNeg=S.accounts.reduce((s,a)=>s+Math.max(0,-toBase(bal[a.id]||0,a.currency)),0);
  const kinds={};for(const i of S.items)if(i.kind!=='liab')kinds[i.kind]=(kinds[i.kind]||0)+toBase(i.value,i.cur);
  const liabItems=S.items.filter(i=>i.kind==='liab').reduce((s,i)=>s+toBase(i.value,i.cur),0);
  let lent=0,owe=0;for(const d of S.debts){const l=toBase(sched(d).left,d.cur);if(d.dir==='lent')lent+=l;else owe+=l}
  const assets=cashPos+Object.values(kinds).reduce((a,b)=>a+b,0)+lent;
  const liabs=cashNeg+liabItems+owe;
  return {cashPos,cashNeg,kinds,liabItems,lent,owe,assets,liabs,net:assets-liabs};
}
function netHistory(n=12){
  const nw=netWorth();const stat=Object.values(nw.kinds).reduce((a,b)=>a+b,0)-nw.liabItems+nw.lent-nw.owe;
  const t=todayStr();
  return monthsBack(n).map(ym=>{const d=monthEnd(ym+'-01');const at=d>t?t:d;return {ym,v:totalCash(balances(at))+stat}});
}
function cashflow(n=12,biz){
  const ms=monthsBack(n);
  return ms.map(ym=>{const c=calc(S.tx.filter(t=>t.date.startsWith(ym)&&(!biz||t.biz===biz)));return {ym,rev:c.rev,inc:c.inc,exp:c.exp,net:c.profit}});
}

/* ---------- графики ---------- */
function niceScale(min,max){
  if(max<=min){max=min+1}
  const span=max-min;const raw=span/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;
  const step=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
  const ticks=[];for(let v=lo;v<=hi+step/2;v+=step)ticks.push(Math.round(v*1e6)/1e6);
  return {lo,hi,ticks};
}
function donutSVG(items,total,label){
  const R=70,C=2*Math.PI*R;let off=0;
  const arcs=items.map((it,i)=>{const len=total?it.v/total*C:0;const s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${it.color}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(label)}"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="26"/>${arcs}<text x="100" y="96" text-anchor="middle" style="font-size:11px">расходы</text><text x="100" y="114" text-anchor="middle" style="font-size:13px;fill:var(--ink);font-weight:600">${esc(short(total))}</text></svg>`;
}
function barsSVG(cf){
  const n=cf.length;const W=Math.max(420,56+n*54),H=250,L=46,Rr=10,T=12,Bt=28;
  const vals=cf.flatMap(c=>[c.inc,c.exp,c.net]);const sc=niceScale(Math.min(0,...vals),Math.max(0,...vals));
  const y=v=>T+(H-T-Bt)*(1-(v-sc.lo)/(sc.hi-sc.lo));const gw=(W-L-Rr)/n;const bw=Math.min(18,gw*0.32);
  let g='',bars='',pts=[],dots='',lab='';
  sc.ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}" ${t===0?'style="stroke:var(--muted)"':''}/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`});
  cf.forEach((c,i)=>{const cx=L+gw*i+gw/2;
    bars+=`<rect x="${cx-bw-1}" y="${y(c.inc)}" width="${bw}" height="${Math.max(0,y(0)-y(c.inc))}" rx="2" fill="var(--in)"><title>${ymFull(c.ym)}: доходы ${B(c.inc)}</title></rect>`;
    bars+=`<rect x="${cx+1}" y="${y(c.exp)}" width="${bw}" height="${Math.max(0,y(0)-y(c.exp))}" rx="2" fill="var(--out)"><title>${ymFull(c.ym)}: расходы ${B(c.exp)}</title></rect>`;
    pts.push([cx,y(c.net)]);dots+=`<circle cx="${cx}" cy="${y(c.net)}" r="3.2" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"><title>${ymFull(c.ym)}: денежный поток ${B(c.net)}</title></circle>`;
    lab+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${ymLabel(c.ym).split(' ')[0]}</text>`});
  const path=pts.map((p,i)=>`${i?'L':'M'}${p[0]},${p[1]}`).join(' ');
  return `<svg class="chart" style="min-width:${W>520?520:W}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Доходы, расходы и денежный поток по месяцам">${g}${bars}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>${dots}${lab}</svg>`;
}
function lineSVG(pts,opts={}){
  const n=pts.length;const W=opts.w||640,H=opts.h||220,L=48,Rr=14,T=14,Bt=28;
  const vals=pts.map(p=>p.v);const sc=niceScale(Math.min(...vals),Math.max(...vals));
  const x=i=>L+(n===1?0:(W-L-Rr)*i/(n-1));const y=v=>T+(H-T-Bt)*(1-(v-sc.lo)/(sc.hi-sc.lo));
  let g='';sc.ticks.forEach(t=>g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  const area=`${line} L${x(n-1)},${y(sc.lo)} L${x(0)},${y(sc.lo)} Z`;
  const step=Math.ceil(n/(opts.maxLabels||8));
  const lab=pts.map((p,i)=>(i%step===0||i===n-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${opts.fmtX?opts.fmtX(p):p.ym}</text>`:'').join('');
  const last=pts[n-1];
  return `<svg class="chart" style="min-width:${Math.min(W,480)}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'График')}">${g}<path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" ${opts.step?'':''}/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===n-1?4.5:2.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"><title>${opts.fmtT?opts.fmtT(p):p.ym}: ${B(p.v)}</title></circle>`).join('')}${lab}</svg>`;
}
function stepSVG(pts,end){
  const W=760,H=190,L=46,Rr=12,T=10,Bt=24;const t0=parseD(pts[0].date).getTime(),t1=Math.max(parseD(end).getTime(),t0+864e5);
  const vals=pts.map(p=>p.v);const sc=niceScale(Math.min(...vals),Math.max(...vals));
  const x=d=>L+(W-L-Rr)*(parseD(d).getTime()-t0)/(t1-t0);const y=v=>T+(H-T-Bt)*(1-(v-sc.lo)/(sc.hi-sc.lo));
  let g='';sc.ticks.forEach(t=>g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`);
  let p=`M${x(pts[0].date)},${y(pts[0].v)}`;for(let i=1;i<pts.length;i++)p+=` H${x(pts[i].date)} V${y(pts[i].v)}`;

  const toggle=`<span class="seg"><label><input type="radio" name="dby" value="cat" data-act="donut" data-by="cat" ${ui.donutBy==='cat'?'checked':''}><span>Категории</span></label><label><input type="radio" name="dby" value="biz" data-act="donut" data-by="biz" ${ui.donutBy==='biz'?'checked':''}><span>Бизнесы</span></label></span>`;
  if(!total)return `<div class="card"><h2>${title}${toggle}</h2><div class="empty"><b>Расходов за период нет</b>Добавьте расход, и здесь появится структура трат.</div></div>`;
  return `<div class="card"><h2>${title}<small>${periodLabel()}</small>${toggle}</h2><div class="donutwrap">${donutSVG(rows,total,'Структура расходов')}<div class="legend">${rows.map(r=>`<div class="it"><span><i class="dot" style="background:${r.color}"></i>${esc(r.label)}</span><span class="num">${pct(r.v,total)}% · ${esc(short(r.v))}</span></div>`).join('')}<div class="it" style="border-top:1px solid var(--line);padding-top:6px"><span><b>Всего</b></span><span class="num"><b>${B(total)}</b></span></div></div></div></div>`;
}
function cashCard(n=6,biz){

}

  <div><div class="muted" style="font-size:12px">Платежи до конца месяца</div><div class="num ${d<0?'neg':'pos'}" style="font-size:20px;font-weight:600">${d<0?'−':'+'}${B(Math.abs(d))}</div></div>

function alertsHTML(){
  const out=[];
  if(!storageOk)out.push(`<div class="alert bad"><span>Память браузера недоступна: данные не сохранятся после закрытия страницы. Сделайте экспорт в «Настройках».</span></div>`);
  for(const a of debtAlerts()){const od=a.days<0;out.push(`<div class="alert ${od?'bad':''}"><span><b>${a.d.dir==='owe'?'Платёж по долгу':'Ожидается возврат'}:</b> ${esc(a.d.who)}, ${money(a.amt,a.d.cur)} · ${od?`просрочено на ${-a.days} дн.`:a.days===0?'сегодня':`через ${a.days} дн.`}</span><button class="btn sm" data-act="debt-pay" data-id="${a.d.id}">Записать платёж</button></div>`)}
  for(const r of pendingRec())out.push(`<div class="alert info"><span><b>${esc(r.name)}</b> · ${money(r.amount,accCur(r.accId))} · ${dLabel(r.next)}</span><span class="tools"><button class="btn sm pri" data-act="rec-ok" data-id="${r.id}">Провести</button><button class="btn sm" data-act="rec-skip" data-id="${r.id}">Пропустить</button></span></div>`);
  return out.length?`<div class="alerts">${out.join('')}</div>`:'';
}

function txRow(t){
  const a=accById(t.accId);let title,desc,amt,cls;
  if(t.type==='transfer'){const to=accById(t.toId);title=`${a?.name||'?'} → ${to?.name||'?'}`;desc=`Перевод${t.note?' · '+esc(t.note):''}`;amt=a&&to&&a.currency!==to.currency?`${num(t.amount,a.currency)} ${a.currency} → ${num(t.toAmount,to.currency)} ${to.currency}`:money(t.amount,a?.currency);cls='muted'}
  else{const c=catById(t.cat);title=esc(t.note||c?.name||(t.type==='income'?'Доход':'Расход'));desc=`${esc(c?.name||'Без категории')} · ${esc(bizName(t.biz))} · ${esc(a?.name||'?')}${t.rid?' · регулярный':''}`;amt=(t.type==='income'?'+':'−')+money(t.amount,a?.currency);cls=t.type==='income'?'pos':''}
  return `<div class="li"><div class="main"><div class="t">${t.type==='transfer'?esc(title):title}</div><div class="d">${desc}</div></div><div class="amt num ${cls}">${amt}</div><div class="acts"><button class="ic" data-act="tx-edit" data-id="${t.id}" aria-label="Изменить">✎</button><button class="ic" data-act="tx-del" data-id="${t.id}" aria-label="Удалить">✕</button></div></div>`;
}
function vTx(){
  let list=S.tx.filter(t=>inPeriod(t.date));
  if(ui.txType)list=list.filter(t=>t.type===ui.txType);if(ui.txBiz)list=list.filter(t=>t.biz===ui.txBiz);if(ui.txAcc)list=list.filter(t=>t.accId===ui.txAcc||t.toId===ui.txAcc);
  const q=ui.txQ.trim().toLowerCase();if(q)list=list.filter(t=>`${t.note||''} ${catById(t.cat)?.name||''}`.toLowerCase().includes(q));
  list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const c=calc(list);let html='',cur='';
  for(const t of list.slice(0,300)){if(t.date!==cur){cur=t.date;html+=`<div class="dayh">${dLabelY(cur)}</div>`}html+=txRow(t)}
  const sel=(id,label,opts,val)=>`<select id="${id}" aria-label="${label}"><option value="">${label}</option>${opts.map(([k,l])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `${head('Операции',`${periodLabel()} · ${list.length} шт.`,`${periodSel()}<button class="btn" data-act="tx-add" data-type="transfer">Перевод</button><button class="btn pri" data-act="tx-add">+ Операция</button>`)}

}

/* курсы онлайн */
async function fetchRates(quiet){
  const st=S.settings;
  try{
    const j=await (await fetch('https://open.er-api.com/v6/latest/USD')).json();if(!j.rates)throw new Error('нет данных');
    let cg={};try{cg=await (await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd')).json()}catch(e){}
    const usd=c=>c==='USD'||c==='USDT'?1:c==='BTC'?cg.bitcoin?.usd:c==='ETH'?cg.ethereum?.usd:(j.rates[c]?1/j.rates[c]:null);
    const ub=usd(st.base);if(!ub)throw new Error('нет курса основной валюты');let n=0;
    for(const c of st.currencies){if(c===st.base)continue;const u=usd(c);if(u){st.rates[c]=+(u/ub).toPrecision(8);n++}}
    st.ratesAt=Date.now();persist();if(!quiet){render();toast(`Курсы обновлены: ${n}`)}else render();
  }catch(e){if(!quiet)toast('Не удалось получить курсы. Введите их вручную.')}
}

  const cash={id:uid(),name:'Наличные',type:'cash',currency:'TJS',opening:9000},card={id:uid(),name:'Карта Visa',type:'debit',currency:'TJS',opening:12000},sav={id:uid(),name:'Накопительный',type:'savings',currency:'USD',opening:1200},cry={id:uid(),name:'Кошелёк USDT',type:'crypto',currency:'USDT',opening:500};
  s.accounts.push(cash,card,sav,cry);
  const t=todayStr(),ms=monthsBack(6);
  const add=(date,type,accId,amount,biz,cat,note,extra={})=>{if(date<=t)s.tx.push({id:uid(),type,date,accId,amount,biz,cat,note,...extra})};
  ms.forEach((ym,i)=>{
    const D=n=>`${ym}-${pad(n)}`;
    for(let k=0;k<4;k++)add(D(3+k*7),'income',card.id,R(2800,4600),K,kS,'Выручка за неделю');
    add(D(1),'expense',card.id,1800,K,kRent,'Аренда помещения');add(D(5),'expense',card.id,R(1900,2600),K,kBuy,'Кофе, молоко, десерты');add(D(12),'expense',card.id,R(1700,2300),K,kBuy,'Закупка сырья');
    add(D(10),'expense',card.id,2400,K,kPay,'Зарплата бариста');add(D(15),'expense',card.id,R(220,380),K,kUt,'Свет и вода');if(i%2)add(D(18),'expense',card.id,R(250,500),K,kAd,'Реклама в соцсетях');add(D(20),'expense',card.id,R(250,400),K,kTax,'Налог');
    add(D(8),'income',card.id,R(2200,4200),F,fP,'Проект для клиента');if(i%2===0)add(D(22),'income',card.id,R(1500,2500),F,fP,'Правки и поддержка');add(D(4),'expense',card.id,R(120,170),F,fSw,'Сервисы и лицензии');add(D(25),'expense',card.id,R(120,260),F,fTax,'Налог');
    add(D(2),'income',card.id,1500,P,pSal,'Подработка');
    for(let k=0;k<5;k++)add(D(2+k*5),'expense',cash.id,R(60,240),P,pFood,'Продукты');
    add(D(6),'expense',cash.id,R(60,120),P,pTr,'Такси');add(D(14),'expense',card.id,R(150,420),P,pFun,'Кафе и кино');add(D(1),'expense',card.id,1200,P,pHome,'Аренда квартиры');add(D(1),'expense',card.id,45,P,pSub,'Подписки');
    if(i<5)add(D(27),'transfer',card.id,2000,null,null,'В накопления',{toId:sav.id,toAmount:r2(2000/9.5)});
  });
  add(addDays(t,-12),'transfer',card.id,950,null,null,'В USDT',{toId:cry.id,toAmount:r2(950/9.5)});
  const nextMonth=addMonths(t.slice(0,8)+'01',1,1),thisM=t.slice(0,8);
  const rec=(name,type,accId,amount,biz,cat,next,auto,freq='monthly')=>s.recurring.push({id:uid(),name,type,accId,amount,biz,cat,freq,next,day:parseD(next).getDate(),auto,end:'',active:true});
  rec('Аренда помещения','expense',card.id,1800,K,kRent,nextMonth,false);rec('Аренда квартиры','expense',card.id,1200,P,pHome,nextMonth,true);rec('Подписки','expense',card.id,45,P,pSub,addMonths(thisM+'20',(t.slice(8)>'20')?1:0,20),true);
  rec('Кредит на оборудование','expense',card.id,650,K,kPay,addMonths(thisM+'28',(t.slice(8)>'28')?1:0,28),false);
  s.debts.push({id:uid(),dir:'owe',who:'Банк «Эсхата»: кредит на оборудование',amount:7800,cur:'TJS',start:addMonths(t,-3),first:addMonths(thisM+'28',(t.slice(8)>'28')?-2:-3,28),n:12,every:1,remind:5,accId:card.id,note:'',disb:false,payments:[]});
  const dd=s.debts[0];dd.payments=[{id:uid(),date:addMonths(t,-2),amount:650,accId:''},{id:uid(),date:addMonths(t,-1),amount:650,accId:''}];
  s.debts.push({id:uid(),dir:'lent',who:'Фаррух (друг)',amount:1500,cur:'TJS',start:addDays(t,-40),first:addDays(t,5),n:3,every:1,remind:7,accId:cash.id,note:'вернёт частями',disb:false,payments:[]});
  s.items.push({id:uid(),kind:'realty',name:'Квартира',value:420000,cur:'TJS'},{id:uid(),kind:'vehicle',name:'Автомобиль',value:6500,cur:'USD'},{id:uid(),kind:'invest',name:'Доля в бизнесе',value:15000,cur:'USD'},{id:uid(),kind:'liab',name:'Ипотека',value:90000,cur:'TJS'});
  s.settings.rates=blankState().settings.rates;
  return s;
}

/* ---------- отрисовка ---------- */
const VIEWS={home:vHome,tx:vTx,biz:vBiz,acc:vAcc,debt:vDebt,rec:vRec,nw:vNw,rep:vRep,set:vSet};
function renderStorageWarn(){if(S)render()}
function render(){
  if(!S)return;
  const bd=debtAlerts().length,pr=pendingRec().length;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button type="button" data-act="nav" data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${l}${k==='debt'&&bd?`<span class="badge">${bd}</span>`:''}${k==='rec'&&pr?`<span class="badge">${pr}</span>`:''}</button>`).join('');
  const m=$('#main');const keep=document.activeElement&&document.activeElement.id==='f-q'?document.activeElement.selectionStart:null;
  m.innerHTML=VIEWS[ui.tab]();
  if(keep!==null){const q=$('#f-q');q.focus();q.setSelectionRange(keep,keep)}
}
function enter(){
  $('#lock').hidden=true;$('#lock').innerHTML='';$('#shell').hidden=false;S=normalize(S);
  if(runRecurring())persist();ui.tab='home';render();bumpIdle();window.scrollTo(0,0);
  if(!S.settings.ratesAt||Date.now()-S.settings.ratesAt>6*3600e3)fetchRates(true);
}

/* ---------- действия ---------- */
const A={
  close:closeModal,
  nav:(d)=>{ui.tab=d.tab;ui.bizSel=null;render();window.scrollTo(0,0)},
  'tx-add':d=>txModal({type:d.type||'expense',date:todayStr(),accId:S.accounts[0]?.id,toId:S.accounts[1]?.id,biz:d.biz||S.businesses[0]?.id}),
  'tx-edit':d=>txModal(S.tx.find(t=>t.id===d.id)),
  'tx-del':d=>ask('Удалить эту операцию?',()=>{S.tx=S.tx.filter(t=>t.id!==d.id);commit()}),
  'acc-add':()=>accModal(),'acc-edit':d=>accModal(accById(d.id)),'acc-del':d=>delAcc(d.id),
  'biz-add':()=>bizModal(),'biz-open':d=>{ui.bizSel=d.id;render();window.scrollTo(0,0)},'biz-back':()=>{ui.bizSel=null;render()},'biz-edit':d=>bizModal(bizById(d.id)),'biz-del':d=>delBiz(d.id),
  'cat-add':d=>catModal(d.biz,d.type),'cat-edit':d=>catModal(null,null,catById(d.id)),'cat-del':d=>delCat(d.id),
  'debt-add':()=>debtModal(),'debt-edit':d=>debtModal(S.debts.find(x=>x.id===d.id)),'debt-pay':d=>payModal(d.id),
  'debt-del':d=>ask('Удалить долг вместе с историей платежей?',()=>{S.debts=S.debts.filter(x=>x.id!==d.id);commit()}),
  'pay-del':d=>{const x=S.debts.find(v=>v.id===d.id);x.payments=x.payments.filter(p=>p.id!==d.pid);commit()},
  'rec-add':()=>recModal(),'rec-edit':d=>recModal(S.recurring.find(x=>x.id===d.id)),'rec-ok':d=>confirmRec(d.id),'rec-skip':d=>skipRec(d.id),
  'rec-del':d=>ask('Удалить регулярный платёж? Уже созданные операции останутся.',()=>{S.recurring=S.recurring.filter(x=>x.id!==d.id);commit()}),
  'item-add':()=>itemModal(),'item-edit':d=>itemModal(S.items.find(x=>x.id===d.id)),'item-del':d=>ask('Удалить позицию?',()=>{S.items=S.items.filter(x=>x.id!==d.id);commit()}),
  donut:d=>{ui.donutBy=d.by;render()},
  lock:()=>lockNow(),
  demo:()=>{const go=()=>{S=loadDemo();ui.tab='home';commit();toast('Загружен пример данных')};if(S.accounts.length||S.tx.length)ask('Пример заменит все текущие данные. Продолжить?',go,'Заменить');else go()},
  wipe:()=>ask('Стереть все данные без возможности восстановления? Сначала сделайте резервную копию.',()=>{S=blankState();ui.bizSel=null;ui.tab='home';commit()},'Стереть'),
  'export-xlsx':()=>doExport('xlsx'),'export-json':()=>doExport('json'),'export-enc':()=>doExport('enc'),
  'show-json':()=>{modal('Данные в формате JSON',`<textarea id="jt" class="codebox" rows="10" readonly style="width:100%">${esc(JSON.stringify(S,null,2))}</textarea><p class="hint" style="margin:0">Выделите всё и скопируйте. Файл не зашифрован.</p>`,null);setTimeout(()=>{const t=$('#jt');t&&t.select()},50)},
  import:()=>$('#file').click(),
  'dav-push':davPush,'dav-pull':davPull,'fetch-rates':()=>fetchRates(false),
  'add-cur':()=>{const c=$('#newcur').value;if(c&&!S.settings.currencies.includes(c)){S.settings.currencies.push(c);commit()}},
  'rm-cur':d=>{const c=d.id;if(S.accounts.some(a=>a.currency===c)||S.items.some(i=>i.cur===c)||S.debts.some(x=>x.cur===c)){toast('Валюта используется в счетах, активах или долгах');return}S.settings.currencies=S.settings.currencies.filter(x=>x!==c);commit()},
  'pin-change':()=>{modal('Сменить PIN',`<label class="f">Текущий PIN<input name="o" type="password" inputmode="numeric" required></label><label class="f">Новый PIN (${META.len} цифр)<input name="n" type="password" inputmode="numeric" pattern="\\d{${META.len}}" required></label>`,async fd=>{
      try{await unpack(JSON.parse(lsGet(STORE)),fd.o)}catch(e){toast('Текущий PIN неверный');return false}
      if(!new RegExp(`^\\d{${META.len}}$`).test(fd.n)){toast(`Нужно ${META.len} цифры`);return false}
      SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(fd.n,SALT);await flush();toast('PIN изменён')},{submit:'Сменить'})}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f&&S)f({...el.dataset})});
document.addEventListener('change',e=>{
  const t=e.target;if(!S)return;
  if(t.dataset.act==='donut'){ui.donutBy=t.dataset.by;render();return}
  if(t.id==='period'){ui.period=t.value;render()}
  else if(t.id==='f-type'){ui.txType=t.value;render()}else if(t.id==='f-biz'){ui.txBiz=t.value;render()}else if(t.id==='f-acc'){ui.txAcc=t.value;render()}
  else if(t.id==='rbiz'){ui.rbiz=t.value;render()}
  else if(t.id==='base'){const nb=t.value,st=S.settings,k=st.rates[nb]||1;for(const c of Object.keys(st.rates))st.rates[c]=+(st.rates[c]/k).toPrecision(10);st.rates[nb]=1;st.base=nb;commit();toast('Основная валюта изменена')}
  else if(t.dataset.rate){const v=+t.value;if(v>0){S.settings.rates[t.dataset.rate]=v;S.settings.ratesAt=null;commit()}}
  else if(t.id==='autolock'){META.lock=+t.value;saveMeta();bumpIdle()}
  else if(['wurl','wuser','wpass'].includes(t.name)){const w=S.settings.webdav;w[{wurl:'url',wuser:'user',wpass:'pass'}[t.name]]=t.value;persist()}
  else if(t.id==='file'&&t.files[0]){const r=new FileReader();r.onload=()=>handleImportText(String(r.result));r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{if(e.target.id==='f-q'){ui.txQ=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- запуск ---------- */
(function boot(){
  const m=lsGet(METAK);if(m){try{Object.assign(META,JSON.parse(m))}catch(e){}}
  const raw=lsGet(STORE);showLock(raw?'unlock':'setup1');
})();
window.addEventListener('pagehide',()=>{if(S&&KEY)flush()});

</script></body></html>
